[project]
name = "airflow-workspace"
version = "0.1.0"
description = "Airflow ETL workflows, examples, and data pipelines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "apache-airflow>=3.3.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "sqlite-utils>=3.35.0",
    "tabulate>=0.9.0",
    "pyarrow>=14.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "debugpy>=1.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]
